/* EVENTOS */
document.addEventListener("click", event => {
  const button = event.target.closest("button");
  if (!button) return;
  const data = button.dataset;

  if (data.nav) return navigate(data.nav);
  if (data.service !== undefined) return navigate("processes", data.service);
  if (data.goto) return goToRisk(data.goto, data.action);
  if (data.drill) return drill(data.drill, data.value);

  if (data.entity) {
    filters.entity = data.entity;
    visibleLimit = PAGE_SIZE;
    render();
    return;
  }

  if (data.editEntity) return entityForm(data.kind, data.editEntity);
  if (data.deleteEntity) return deleteEntity(data.kind, data.deleteEntity);
  if (data.editRisk) return riskForm(data.editRisk);

  if (data.deleteRisk) {
    const risk = state.risks.find(item => item.id === data.deleteRisk);

    confirmModal("Excluir risco e ações",
      `Excluir “${risk.activity}” e suas ${risk.actions.length} ação(ões)?`,
      () => {
        const snapshot = snapshotState();
        state.risks = state.risks.filter(item => item.id !== risk.id);
        commit("Risco e ações excluídos.", null, undoer(snapshot));
        closeModal();
        render();
      }, "Excluir risco e ações");
    return;
  }

  if (data.editAction) return editAction(data.risk, data.editAction);

  if (data.deleteAction) {
    const risk = state.risks.find(item => item.id === data.risk);
    const action = risk.actions.find(item => item.id === data.deleteAction);

    confirmModal("Remover ação", `Remover “${action.description}”?`, () => {
      const snapshot = snapshotState();
      risk.actions = risk.actions.filter(item => item.id !== action.id);
      commit("Ação removida.", risk, undoer(snapshot));
      closeModal();
      render();
      $("#plan-" + risk.id + " summary")?.focus();
    }, "Remover ação");
    return;
  }

  switch (data.cmd) {
    case "close-modal": closeModal(); break;
    case "new-service": entityForm("process"); break;
    case "new-project": entityForm("project"); break;
    case "new-risk": riskForm(); break;
    case "export": exportBackup(); break;
    case "csv-risks": exportCSV("risks", [...state.risks].sort((a, b) => a.number - b.number)); break;
    case "csv-actions": exportCSV("actions", [...state.risks].sort((a, b) => a.number - b.number)); break;
    case "csv-context": exportCSV("risks", selectedRisks()); break;
    case "import": $("#import-file").click(); break;
    case "pdf": openPDF(); break;
    case "retry-save":
      persist().then(() => {
        renderHeader();
        if (view === "data") renderData();
        toast(storageStatus);
      });
      break;
    case "clear-legacy":
      confirmModal("Apagar cópia antiga",
        "A cópia no localStorage já foi migrada para o IndexedDB. Apagá-la libera espaço, " +
        "mas você perde esse backup automático antigo. Exporte um backup JSON antes, se quiser.",
        () => {
          clearLegacyCopy();
          closeModal();
          renderData();
          toast("Cópia antiga apagada.");
        }, "Apagar cópia antiga");
      break;
    case "more": {
      const before = visibleLimit;
      visibleLimit += PAGE_SIZE;
      renderResults();
      const next = selectedRisks()[before];
      if (next) document.getElementById("risk-" + next.id)?.focus({ preventScroll: true });
      break;
    }
    case "reload": location.reload(); break;
    case "clear-filters":
      visibleLimit = PAGE_SIZE;
      filters = emptyFilters();
      if (view === "processes") filters.kind = "process";
      if (view === "projects") filters.kind = "project";
      render();
      break;
  }
});

document.addEventListener("change", event => {
  const element = event.target;
  const data = element.dataset;

  if (element.dataset.heatmode !== undefined) {
    heatMode = element.value === "residual" ? "residual" : "inherent";
    renderResults();
    document.getElementById("heat-mode")?.focus({ preventScroll: true });
    return;
  }

  if (data.filter) {
    filters[data.filter] = element.value;
    visibleLimit = PAGE_SIZE;

    if (data.filter === "kind") {
      filters.entity = "";
      render();
    } else {
      renderResults();
      if ($("#entities")) renderEntities();
    }

    document.getElementById(element.id)?.focus({ preventScroll: true });
    return;
  }

  if (data.scale) {
    const risk = state.risks.find(item => item.id === data.risk);
    const value = element.value === "" ? null : Number(element.value);
    if (risk[data.scale] === value) return;

    risk[data.scale] = value;
    if (data.scale.startsWith("residual")) normalizeResidual(risk, data.scale);
    commit("Avaliação atualizada.", risk);

    const hiddenByFilter = filters.severity && filters.severity !== riskBand(risk).name;
    render();

    if (hiddenByFilter) {
      $("#filter-severity")?.focus({ preventScroll: true });
      toast("Avaliação atualizada. O risco saiu da faixa de severidade filtrada.");
    }
    return;
  }

  if (data.actionStatus) {
    const risk = state.risks.find(item => item.id === data.risk);
    const action = risk.actions.find(item => item.id === data.actionStatus);
    if (action.status === element.value) return;

    action.status = element.value;
    commit("Status da ação atualizado.", risk);
    render();
  }
});

const debounce = (fn, wait = 150) => {
  let timer;
  return (...args) => {
    clearTimeout(timer);
    timer = setTimeout(() => fn(...args), wait);
  };
};

const applySearch = debounce(() => {
  visibleLimit = PAGE_SIZE;
  renderResults();
});

document.addEventListener("input", event => {
  if (event.target.dataset.filter === "search") {
    filters.search = event.target.value;
    applySearch();
  }
});

document.addEventListener("submit", event => {
  const form = event.target;
  if (!form.dataset.actionForm) return;
  event.preventDefault();

  if (!validateForm(form)) return;

  const risk = state.risks.find(item => item.id === form.dataset.actionForm);
  risk.actions.push({
    id: uid(),
    ...formValues(form),
    demo: false
  });

  form.reset();
  commit("Ação adicionada.", risk);
  render();

  const nextForm = $(`form[data-action-form="${risk.id}"]`);
  nextForm?.elements.description.focus();
});

const applyServiceSearch = debounce(() => renderServiceList());

$("#service-search").addEventListener("input", event => {
  serviceSearch = event.target.value;
  applyServiceSearch();
});

$("#menu-toggle").addEventListener("click", () => {
  const opened = $("#sidebar").classList.toggle("open");
  $("#menu-toggle").setAttribute("aria-expanded", String(opened));
  if (opened) $("#navigation button")?.focus();
});

let currentDay = localDate();
setInterval(() => {
  const nextDay = localDate();
  if (nextDay === currentDay) return;
  currentDay = nextDay;
  if (!$("#modal").open) render();
}, 60000);

async function boot() {
  const result = await initStorage();

  state = result.state;
  storageStatus = result.status;
  storageBlocked = result.blocked;
  storageUsage = result.usageRatio ?? 0;
  loadMessage = result.message || "";

  setupTheme();
  render();
  onExternalChange(markStale);

  if (result.migrated) {
    toast("Dados migrados do armazenamento antigo (localStorage) para o IndexedDB.");
  }
}

boot();
</script>
</body>
</html>
